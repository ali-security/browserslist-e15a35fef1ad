name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: uvu test name pattern; empty runs the whole suite
        required: false
        default: ''
permissions:
  contents: read
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: pnpm
      - name: Point npm at the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-02-14T17:50:55.881000Z
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            # `pnpm test` is `pnpm run /^test:/` = test:coverage + test:lint +
            # test:size. test:coverage wraps this very same unit suite in c8 with
            # a `lines: 100` minimum-coverage gate, which is not a test: with
            # BROWSERSLIST_IGNORE_OLD_DATA set, node.js::oldDataWarning's warning
            # branch is never taken, so coverage lands at 99.94% and the gate
            # fails the job after all 282 tests pass. Run the same three scripts
            # with the coverage threshold off; no test is dropped.
            pnpm unit
            pnpm run test:lint
            pnpm run test:size
          fi
      - name: Pack the tarball
        run: |
          npx clean-publish --without-publish --temp-dir "$RUNNER_TEMP/clean-package"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$RUNNER_TEMP/clean-package"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/browserslist-*.tgz
          if-no-files-found: error
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 20
          - 18
          - 16
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Point npm at the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-02-14T17:50:55.881000Z
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm unit
          fi
  old:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 14
          - 12
          - 10
          - 8
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v1
        with:
          version: 3
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Point npm at the registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-02-14T17:50:55.881000Z
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Run unit tests
        if: matrix.node-version == 14
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            NODE_ENV=test ./node_modules/.bin/uvu test "${{ inputs.test-filter }}"
          else
            pnpm run unit
          fi
      - name: Run unit tests except the fs-extra ones
        if: matrix.node-version == 12
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: |
          # `test-filter` is deliberately ignored on this leg. The cache,
          # custom, extends and shareable-stats suites call fs-extra 11's
          # `remove()`, which needs `fs.rm` (Node.js >= 14), so they abort in
          # their own before/after hooks here no matter what the filter says.
          # Instead of a filtered selection this leg always runs every other
          # suite: a superset of what the filter could legitimately reach on
          # Node.js 12, so no runnable test is dropped.
          NODE_ENV=test ./node_modules/.bin/uvu test '^(?!cache|custom|extends|shareable-stats).*\.test\.js$'
      - name: Write the ES5 API smoke script
        run: |
          cat > "$RUNNER_TEMP/old-node-smoke.js" <<'SMOKE_EOF'
          // Public-API smoke test for ancient Node.js runtimes.
          //
          // uvu 0.5.6's CLI runner reads globalThis (uvu/run/index.js:2) before
          // its own polyfill is loaded, so on Node.js 8 and 10 the test suite
          // dies with a ReferenceError before a single test runs. This script
          // exercises the public API of index.js directly, in plain ES5, so
          // those legs still assert real behaviour instead of being green
          // no-ops. It throws (and therefore exits non-zero) on the first
          // failed assertion.

          var assert = require('assert')

          var browserslist = require(process.env.GITHUB_WORKSPACE + '/index.js')

          var passed = 0

          function check(name, body) {
            body()
            passed += 1
            console.log('ok - ' + name)
          }

          check('browserslist() resolves a query to a non-empty array of strings', function () {
            var result = browserslist('last 2 versions')
            assert.ok(Array.isArray(result), 'expected an array')
            assert.ok(result.length > 0, 'expected at least one browser')
            for (var i = 0; i < result.length; i++) {
              assert.strictEqual(
                typeof result[i],
                'string',
                'expected a string at index ' + i
              )
              assert.ok(
                result[i].indexOf(' ') > 0,
                'expected a "name version" pair, got ' + result[i]
              )
            }
          })

          check('browserslist() resolves an exact version query', function () {
            assert.deepEqual(browserslist('ie 8'), ['ie 8'])
          })

          check('browserslist() accepts an array of queries', function () {
            var result = browserslist(['chrome 100', 'ie 11'])
            assert.deepEqual(result, ['chrome 100', 'ie 11'])
          })

          check('browserslist() uses the defaults when called with no arguments', function () {
            var result = browserslist()
            assert.ok(Array.isArray(result), 'expected an array')
            assert.ok(result.length > 0, 'expected at least one browser')
          })

          check('browserslist() rejects a non-string, non-array argument', function () {
            assert.throws(function () {
              browserslist(42)
            })
          })

          check('browserslist.coverage() returns a number', function () {
            var coverage = browserslist.coverage(['ie 11'])
            assert.strictEqual(typeof coverage, 'number')
            assert.ok(coverage >= 0, 'expected a non-negative coverage')
            assert.ok(coverage <= 100, 'expected a coverage of at most 100')
          })

          check('browserslist.parse() splits a query string', function () {
            var parsed = browserslist.parse('ie 8')
            assert.ok(Array.isArray(parsed), 'expected an array')
            assert.strictEqual(parsed.length, 1)
            assert.strictEqual(parsed[0].query, 'ie 8')
            assert.strictEqual(parsed[0].type, 'browser_version')
            assert.strictEqual(parsed[0].browser, 'ie')
            assert.strictEqual(parsed[0].version, '8')
          })

          check('repeated queries hit the query cache', function () {
            var first = browserslist('last 2 versions')
            var second = browserslist('last 2 versions')
            assert.strictEqual(first, second, 'expected the cached array to be reused')
          })

          check('browserslist.clearCaches() keeps results stable', function () {
            var before = browserslist('ie 8')
            assert.strictEqual(typeof browserslist.clearCaches, 'function')
            browserslist.clearCaches()
            var after = browserslist('ie 8')
            assert.deepEqual(after, before)
          })

          console.log(passed + ' smoke checks passed')
          SMOKE_EOF
      - name: Run the old Node.js API smoke test
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: '1'
        run: node "$RUNNER_TEMP/old-node-smoke.js"
